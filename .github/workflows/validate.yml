name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workflows:
    name: workflows and knowledge base
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate workflows and regenerate the registry
        run: python3 tools/validate_repo.py

      - name: Fail if the registry is stale
        run: |
          if ! git diff --quiet -- automations/registry.json; then
            echo "::error::automations/registry.json is out of date. Run: python3 tools/validate_repo.py and commit the result."
            git --no-pager diff --stat -- automations/registry.json
            exit 1
          fi

      - name: Check knowledge base integrity
        run: |
          python3 - <<'PY'
          import glob, json, sys
          files = glob.glob("knowledge-base/**/*.json", recursive=True)
          bad = []
          for f in files:
              try:
                  json.load(open(f, encoding="utf-8"))
              except Exception as e:
                  bad.append((f, str(e)))
          print(f"checked {len(files)} json files")
          for f, e in bad:
              print(f"::error file={f}::{e}")
          sys.exit(1 if bad else 0)
          PY

      - name: Search CLI smoke test
        run: |
          python3 tools/search.py "append row" --ops --limit 3
          python3 tools/search.py "send email" --limit 3

  security:
    name: security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scan the full repository
        if: github.event_name != 'pull_request'
        run: python3 tools/security_scan.py --fail-on high

      - name: Scan only what this pull request adds or changes
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          python3 tools/security_scan.py --changed --base "origin/${{ github.base_ref }}" --fail-on high

      - name: Report findings in the job summary
        if: always()
        run: |
          {
            echo "## Security scan"
            echo '```'
            python3 tools/security_scan.py --fail-on none || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  mcp-server:
    name: mcp server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Protocol and tool tests
        run: python3 server/test_server.py

      - name: Unit, integration and regression tests
        run: python3 -m unittest discover -s tests -v

      - name: Search benchmark report
        run: python3 tests/test_search_benchmark.py | tail -20

      - name: Package installs and exposes its entry point
        run: |
          pip install -e .
          python3 -c "import server.mcp_server as m; print('server module ok', m.SERVER_INFO)"
